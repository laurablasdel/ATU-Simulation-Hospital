*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:var(--ink)}

header h1{margin:0;font-size:20px}header small{display:block;opacity:.85;margin-top:2px}
.badge{padding:5px 9px;border-radius:12px;background:#ffffff22;font-size:11px;font-weight:700}
.layout{display:grid;grid-template-columns:255px 1fr;min-height:calc(100vh - 66px)}
aside{background:#173f32;color:#fff;padding:10px;position:sticky;top:0;height:calc(100vh - 66px);overflow:auto}
aside .group{font-size:10px;text-transform:uppercase;letter-spacing:.8px;opacity:.7;margin:12px 8px 4px}

const FILE_DB_NAME=STORAGE_KEY+":files";
const FILE_DB_STORE="files";
function openFileDb(){
 return new Promise((resolve,reject)=>{
  const req=indexedDB.open(FILE_DB_NAME,1);
  req.onupgradeneeded=()=>{const db=req.result;if(!db.objectStoreNames.contains(FILE_DB_STORE))db.createObjectStore(FILE_DB_STORE)};
  req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error);
 });
}
async function storeDiagnosticFile(file){
 if(atuCloudReady&&atuSupabase){
  const safe=String(file.name||"diagnostic").replace(/[^a-zA-Z0-9._-]/g,"_");
  const path=`${Date.now()}-${Math.random().toString(36).slice(2,8)}-${safe}`;
  const {error}=await atuSupabase.storage.from("diagnostics").upload(path,file,{contentType:file.type,upsert:false});
  if(error)throw error;
  return "cloud:"+path;
 }
 const db=await openFileDb(),key=uid("diagfile");
 await new Promise((resolve,reject)=>{const tx=db.transaction(FILE_DB_STORE,"readwrite");tx.objectStore(FILE_DB_STORE).put(file,key);tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error)});
 return "local:"+key;
}
async function getDiagnosticFile(key){
 if(String(key).startsWith("cloud:")){
  if(!atuSupabase)return null;
  const {data,error}=await atuSupabase.storage.from("diagnostics").download(String(key).slice(6));
  if(error){console.error(error);return null}
  return data;
 }
 const localKey=String(key).replace(/^local:/,""),db=await openFileDb();
 return await new Promise((resolve,reject)=>{const tx=db.transaction(FILE_DB_STORE,"readonly"),req=tx.objectStore(FILE_DB_STORE).get(localKey);req.onsuccess=()=>resolve(req.result||null);req.onerror=()=>reject(req.error)});
}
async function deleteDiagnosticFile(key){
 if(String(key).startsWith("cloud:")){
  if(atuSupabase)try{await atuSupabase.storage.from("diagnostics").remove([String(key).slice(6)])}catch(e){}
  return;
 }
 const localKey=String(key).replace(/^local:/,"");
 try{const db=await openFileDb();await new Promise((resolve,reject)=>{const tx=db.transaction(FILE_DB_STORE,"readwrite");tx.objectStore(FILE_DB_STORE).delete(localKey);tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error)})}catch(e){}
}
async function openDiagnosticFile(fileId){
 const meta=(state.diagnosticFiles||[]).find(f=>f.id===fileId);
 if(!meta){alert("Attachment metadata was not found.");return}
 const file=await getDiagnosticFile(meta.storageKey);
 if(!file){alert("The attachment is not available in this browser. It may have been uploaded on another device.");return}
 const url=URL.createObjectURL(file);
 window.open(url,"_blank");
 setTimeout(()=>URL.revokeObjectURL(url),60000);
}

function queueRelease(kind,patientId,title,content,extra={}){
 state.releaseQueue ||= [];
 const item={
   id:uid("release"),kind,patientId,title,content,
   status:"pending",createdAt:nowLocal(),releasedAt:"",
   ...extra
 };
 state.releaseQueue.push(item);
 audit("Pending item created",patientId,`${kind}: ${title}`);
 liveSave("queue_changed",{patientId,itemId:item.id});
 return item;
}
function releaseItem(id){
 const item=(state.releaseQueue||[]).find(x=>x.id===id);
 if(!item||item.status==="released")return;
 item.status="released";item.releasedAt=nowLocal();

 if(!item.chartRecordId&&item.kind==="order"){
   state.orders.push({
    id:uid("order"),patientId:item.patientId,time:item.releasedAt,
    provider:item.provider||activePatient()?.provider||"Provider",
    type:item.orderType||"Other",text:item.content,status:"Active",enteredBy:"Faculty Release"
   });
 }else if(!item.chartRecordId&&item.kind==="result"){
   if(Array.isArray(item.labRows)&&item.labRows.length){
    for(const row of item.labRows){
     if(!String(row.value||"").trim())continue;
     state.labs.push({id:uid("lab"),patientId:item.patientId,time:item.releasedAt,type:"Laboratory",test:row.test,result:row.value,reference:row.reference||"",flag:row.flag||"Normal",comments:`${item.title} • Released by faculty`});
    }
   }else{
    state.labs.push({
     id:uid("lab"),patientId:item.patientId,time:item.releasedAt,type:item.resultType||"Laboratory",
     test:item.title,result:item.content,reference:item.reference||"",flag:item.flag||"Normal",comments:"Released by faculty"
    });
   }
   for(const fileId of (item.fileIds||[])){
    const f=(state.diagnosticFiles||[]).find(x=>x.id===fileId);
    if(f){f.status="released";f.releasedAt=item.releasedAt;}
   }
 }else if(!item.chartRecordId&&item.kind==="message"){
   state.messages ||= [];
   state.messages.push({
    id:uid("msg"),patientId:item.patientId,at:item.releasedAt,
    from:"Faculty",to:"Student",subject:item.title,message:item.content,read:false,releaseItemId:item.id
   });
 }
 createNotificationForRelease(item);
 audit("Faculty item released",item.patientId,`${item.kind}: ${item.title}`);
 liveSave("item_released",{patientId:item.patientId,itemId:item.id,kind:item.kind,title:item.title});
 renderFaculty();
}
function createNotificationForRelease(item){
 state.notifications ||= [];
 state.notifications.push({
  id:uid("notif"),patientId:item.patientId,createdAt:nowLocal(),
  type:item.kind,title:item.kind==="order"?"New Provider Order":item.kind==="result"?"New Result":"Faculty Message",
  body:item.kind==="message"?item.content:item.title,
  releaseItemId:item.id,read:false
 });
}

function atuCloudBadge(text){
 const b=document.getElementById("saveBadge");

async function atuCloudPull(){
 saveCurrentViewDraft();
 const {data,error}=await atuSupabase.from("ehr_sync").select("payload,updated_by,updated_at").eq("collection",ATU_CLOUD_ROW_COLLECTION).eq("item_id",ATU_CLOUD_ROW_ID).maybeSingle();
 if(error)throw error;
 if(!data?.payload)return false;
 atuCloudApplying=true;
 try{
  const incoming=data.payload;
  const tabMode=getTabMode();
  state=incoming;
  state.settings ||= {mode:"faculty",facultyPin:"2026"};
  state.releaseQueue ||= [];state.messages ||= [];state.notifications ||= [];state.diagnosticFiles ||= [];state.labPanels ||= [];state.vitals ||= [];
  if(!state.settings.stephanieVitalsCleared20260916){state.vitals=state.vitals.filter(v=>v.patientId!=="stephanie-smith");state.settings.stephanieVitalsCleared20260916=true;atuStephanieVitalsMigrationDirty=true;}
  localStorage.setItem(STORAGE_KEY,JSON.stringify(state));
  setTabMode(tabMode);
 }finally{atuCloudApplying=false}
 return true;
}
async function atuCloudPush(){
 if(!atuCloudReady||atuCloudApplying||!atuSupabase)return;
 const payload=JSON.parse(JSON.stringify(state));
 const {error}=await atuSupabase.from("ehr_sync").upsert({
  collection:ATU_CLOUD_ROW_COLLECTION,item_id:ATU_CLOUD_ROW_ID,patient_id:null,
  payload,updated_by:ATU_CLOUD_CLIENT,updated_at:new Date().toISOString()
 },{onConflict:"collection,item_id"});
 if(error)throw error;
}
function atuCloudSchedule(){
 if(!atuCloudReady||atuCloudApplying)return;
 clearTimeout(atuCloudTimer);
 atuCloudTimer=setTimeout(async()=>{
  try{atuCloudBadge("Cloud: syncing…");await atuCloudPush();atuCloudBadge("Cloud: LIVE ✓")}
  catch(e){console.error("ATU cloud sync",e);atuCloudBadge("Cloud sync error")}
 },40);
}
async function atuCloudReceive(payload){
 saveCurrentViewDraft();
 const row=payload.new||payload.old;
 if(!row||row.collection!==ATU_CLOUD_ROW_COLLECTION||row.item_id!==ATU_CLOUD_ROW_ID||row.updated_by===ATU_CLOUD_CLIENT)return;
 if(payload.eventType==="DELETE")return;
 atuCloudApplying=true;
 try{
  const tabMode=getTabMode();
  state=row.payload;
  state.settings ||= {mode:"faculty",facultyPin:"2026"};
  state.releaseQueue ||= [];state.messages ||= [];state.notifications ||= [];state.diagnosticFiles ||= [];state.labPanels ||= [];state.vitals ||= [];
  if(!state.settings.stephanieVitalsCleared20260916){state.vitals=state.vitals.filter(v=>v.patientId!=="stephanie-smith");state.settings.stephanieVitalsCleared20260916=true;atuStephanieVitalsMigrationDirty=true;}
  localStorage.setItem(STORAGE_KEY,JSON.stringify(state));
  setTabMode(tabMode);
 }finally{atuCloudApplying=false}
 atuCloudBadge("Cloud: LIVE ✓ • update received");
 window.refreshSimulationRecords?.();applyMode();if(window.simRefreshFromShared)window.simRefreshFromShared();else render();
 if(!isFaculty())setTimeout(showNextNotification,100);
}
async function atuCloudInit(){
 if(!ATU_SUPABASE_URL||!ATU_SUPABASE_KEY){atuCloudBadge("Local mode • this browser only");return;}
 try{
  if(!window.supabase?.createClient)throw new Error("Supabase library did not load");
  atuSupabase=window.supabase.createClient(ATU_SUPABASE_URL,ATU_SUPABASE_KEY,{realtime:{params:{eventsPerSecond:20}}});
  atuCloudBadge("Cloud: connecting…");
  atuCloudChannel=atuSupabase.channel("atu-simulation-hospital-live")
   .on("postgres_changes",{event:"*",schema:"public",table:"ehr_sync",filter:"collection=eq.app"},atuCloudReceive)
   .subscribe(status=>{
    if(status==="SUBSCRIBED")atuCloudBadge("Cloud: LIVE ✓");
    if(status==="CHANNEL_ERROR"||status==="TIMED_OUT")atuCloudBadge("Cloud: disconnected");
   });
  const found=await atuCloudPull();
  atuCloudReady=true;
  if(!found||atuStephanieVitalsMigrationDirty){await atuCloudPush();atuStephanieVitalsMigrationDirty=false;}
  atuCloudBadge("Cloud: LIVE ✓");
  window.refreshSimulationRecords?.();applyMode();if(window.simRefreshFromShared)window.simRefreshFromShared();else render();
  if(!isFaculty())setTimeout(showNextNotification,100);
 }catch(e){
  console.error("ATU cloud initialization failed",e);
  atuCloudReady=false;atuCloudBadge("Cloud offline • local backup");
 }
}

/* Student charting draft autosave: preserves in-progress fields when moving between chart tabs. */
const ATU_DRAFT_KEY=STORAGE_KEY+"_student_drafts_v1";
function draftStore(){
 try{return JSON.parse(localStorage.getItem(ATU_DRAFT_KEY)||"{}")||{}}catch(e){return {}}
}
function draftId(view=currentView,patientId=activePatientId){
 return patientId&&view ? patientId+"::"+view : "";
}
function saveCurrentViewDraft(){
 if(isFaculty()||!activePatientId||!currentView)return;
 const root=document.getElementById("view");if(!root)return;
 const values={};let hasValue=false;
 root.querySelectorAll("input[id],textarea[id],select[id]").forEach(el=>{
  if(el.type==="file"||el.type==="button"||el.type==="submit")return;
  const value=(el.type==="checkbox"||el.type==="radio")?!!el.checked:el.value;
  values[el.id]=value;
  if((typeof value==="boolean"&&value)||String(value??"").trim())hasValue=true;
 });
 if(!Object.keys(values).length)return;
 const all=draftStore(),key=draftId();
 if(hasValue){
  all[key]={patientId:activePatientId,view:currentView,values,savedAt:new Date().toISOString()};
  localStorage.setItem(ATU_DRAFT_KEY,JSON.stringify(all));
  atuCloudBadge("Draft auto-saved");
 }else if(all[key]){
  delete all[key];localStorage.setItem(ATU_DRAFT_KEY,JSON.stringify(all));
 }
}
function restoreCurrentViewDraft(){
 if(isFaculty()||!activePatientId||!currentView)return;
 const d=draftStore()[draftId()];if(!d?.values)return;
 const root=document.getElementById("view");if(!root)return;
 Object.entries(d.values).forEach(([id,value])=>{
  const el=root.querySelector("#"+CSS.escape(id));if(!el||el.type==="file")return;
  if(el.type==="checkbox"||el.type==="radio")el.checked=!!value;else el.value=value??"";
 });
}
function clearCurrentViewDraft(){
 const key=draftId();if(!key)return;
 const all=draftStore();if(all[key]){delete all[key];localStorage.setItem(ATU_DRAFT_KEY,JSON.stringify(all));}
}

function renderPEWS(){
 if(!requirePatient())return;
 const rows=(state.pewsAssessments||[]).filter(x=>x.patientId===activePatientId).slice().reverse();
 const behavior=[
  ["0","Playing / appropriate — active, alert, and interacting appropriately for age."],
  ["1","Sleeping — asleep but otherwise appropriate when aroused."],
  ["2","Irritable — difficult to console or noticeably more irritable than expected."],
  ["3","Lethargic, confused, or reduced response to pain — markedly decreased interaction or responsiveness."]
 ];
 const cardiovascular=[
  ["0","Pink color OR capillary refill 1–2 seconds."],
  ["1","Pale color OR capillary refill about 3 seconds."],
  ["2","Gray color OR capillary refill about 4 seconds OR heart rate 20 beats/min above the normal range for age."],
  ["3","Gray / mottled color OR capillary refill 5 seconds or longer OR heart rate 30 beats/min above the normal range for age OR bradycardia."]
 ];
 const respiratory=[
  ["0","Respiratory rate and effort within the expected range for age; no retractions."],
  ["1","Respiratory rate more than 10 breaths/min above the expected range for age OR accessory-muscle use OR approximately 30% oxygen requirement."],
  ["2","Respiratory rate more than 20 breaths/min above the expected range for age OR retractions OR approximately 40% oxygen requirement."],
  ["3","Respiratory rate 5 or more breaths/min below the expected range for age with retractions or grunting OR approximately 50% oxygen requirement."]
 ];
 const opts=(items,label)=>'<option value="">Select '+label+' score…</option>'+items.map(([score,desc])=>'<option value="'+score+'">'+score+' — '+esc(desc)+'</option>').join("");
 const guide=(title,items)=>'<div class="pewsGuide"><h3>'+title+'</h3>'+items.map(([score,desc])=>'<div class="pewsGuideRow"><b class="pewsScoreBox">'+score+'</b><span>'+esc(desc)+'</span></div>').join("")+'</div>';
 const riskInfo=(score)=>{
  if(score>=7)return {level:"RED",label:"High Risk — Immediate Action",cls:"pewsRed",care:["Call MET / Rapid Response per facility protocol.","Notify charge nurse, senior staff, and attending provider immediately.","Initiate emergency interventions per protocol.","Use continuous monitoring and increase frequency of vital signs and reassessment.","Prepare for a higher level of care if indicated; stay with the patient."]};
  if(score>=4)return {level:"YELLOW / AMBER",label:"Intermediate Risk",cls:"pewsYellow",care:["Notify charge nurse and responsible provider.","Increase frequency of vital signs and PEWS reassessment per facility policy.","Perform focused reassessment and provide indicated interventions.","Monitor closely for worsening findings and escalate if the score or condition deteriorates."]};
  return {level:"GREEN",label:"Low Risk / Stable",cls:"pewsGreen",care:["Continue routine care and monitoring.","Reassess PEWS and vital signs per facility policy.","Continue to observe for any change in condition and escalate for clinical concern regardless of score."]};
 };
 document.getElementById("view").innerHTML=
 panel("Pediatric Early Warning Score (PEWS)",`
  <div class="note" style="margin-bottom:10px">Select one score for each category. The total calculates automatically.</div>
  <div class="grid">
   <label>Student / RN Initials<input id="pewsStudent" placeholder="Initials or student name"></label>
   <label>Date / Time<input id="pewsTime" type="datetime-local"></label>
  </div>
  <div class="pewsGrid">
   <label><b>Behavior</b><select id="pewsBehavior">${opts(behavior,"Behavior")}</select></label>
   <label><b>Cardiovascular</b><select id="pewsCardio">${opts(cardiovascular,"Cardiovascular")}</select></label>
   <label><b>Respiratory</b><select id="pewsResp">${opts(respiratory,"Respiratory")}</select></label>
  </div>
  <div class="pewsTotal">PEWS TOTAL: <strong id="pewsTotal">—</strong> <span id="pewsMath" class="note"></span></div>
  <div id="pewsRisk" class="pewsRisk pewsNeutral"><div class="pewsRiskTitle">Complete all 3 categories to calculate risk level.</div></div>
  <div class="pewsTraffic">
   <div class="pewsTrafficCard pewsGreen"><b>GREEN (0–3)</b><span>Low Risk / Stable</span></div>
   <div class="pewsTrafficCard pewsYellow"><b>YELLOW / AMBER (4–6)</b><span>Intermediate Risk</span></div>
   <div class="pewsTrafficCard pewsRed"><b>RED (≥7)</b><span>High Risk / Immediate Action</span></div>
  </div>
  <div class="actions"><button id="savePEWS" class="primary">Save PEWS Score</button></div>
 `)+
 panel("PEWS Scoring Guide — Full Descriptions",`
  <div class="pewsGuideGrid">${guide("Behavior",behavior)}${guide("Cardiovascular",cardiovascular)}${guide("Respiratory",respiratory)}</div>
 `)+
 panel("Previous PEWS Scores",`
  <table><thead><tr><th>Date / Time</th><th>Student / RN</th><th>Behavior</th><th>Cardiovascular</th><th>Respiratory</th><th>Total</th></tr></thead>
  <tbody>${rows.map(x=>`<tr><td>${esc(x.time)}</td><td>${esc(x.student)}</td><td>${esc(x.behavior)}</td><td>${esc(x.cardiovascular)}</td><td>${esc(x.respiratory)}</td><td><b>${esc(x.total)}</b></td></tr>`).join("")||'<tr><td colspan="6">No PEWS scores documented yet.</td></tr>'}</tbody></table>
 `);
 const total=()=>{
  const vals=[pewsBehavior.value,pewsCardio.value,pewsResp.value];
  if(vals.some(v=>v==="")){
   pewsTotal.textContent="—";pewsMath.textContent="Complete all 3 categories";
   pewsRisk.className="pewsRisk pewsNeutral";
   pewsRisk.innerHTML='<div class="pewsRiskTitle">Complete all 3 categories to calculate risk level.</div>';
   return null;
  }
  const nums=vals.map(Number),sum=nums.reduce((a,b)=>a+b,0),risk=riskInfo(sum);
  pewsTotal.textContent=String(sum);pewsMath.textContent="("+nums[0]+" + "+nums[1]+" + "+nums[2]+")";
  pewsRisk.className="pewsRisk "+risk.cls;
  pewsRisk.innerHTML='<div class="pewsRiskTitle">'+esc(risk.level)+' — '+esc(risk.label)+'</div><div class="pewsCareTitle">Suggested Care / Escalation</div><ul>'+risk.care.map(x=>'<li>'+esc(x)+'</li>').join("")+'</ul>';
  return sum;
 };
 [pewsBehavior,pewsCardio,pewsResp].forEach(el=>el.onchange=total);
 pewsTime.value=new Date(Date.now()-new Date().getTimezoneOffset()*60000).toISOString().slice(0,16);
 savePEWS.onclick=()=>{
  const score=total();
  if(score===null){alert("Select a Behavior, Cardiovascular, and Respiratory score.");return}
  const student=pewsStudent.value.trim();
  if(!student){alert("Enter student name or RN initials.");return}
  state.pewsAssessments ||= [];
  const risk=riskInfo(score);
  state.pewsAssessments.push({id:uid("pews"),patientId:activePatientId,time:pewsTime.value||nowLocal(),student,behavior:Number(pewsBehavior.value),cardiovascular:Number(pewsCardio.value),respiratory:Number(pewsResp.value),total:score,riskLevel:risk.level,riskLabel:risk.label});
  audit("PEWS documented",activePatientId,`PEWS ${score} — Behavior ${pewsBehavior.value}, Cardiovascular ${pewsCardio.value}, Respiratory ${pewsResp.value}`);
  liveSave("pews_saved",{patientId:activePatientId,total:score});
  renderPEWS();
 };
}

   const storageKey=await storeDiagnosticFile(file);
   const meta={id:uid("diag"),patientId,title,fileName:file.name,mimeType:file.type,size:file.size,storageKey,status:"pending",uploadedAt:nowLocal(),releasedAt:""};
   state.diagnosticFiles ||= [];state.diagnosticFiles.push(meta);
   queueRelease("result",patientId,title,impression||"Diagnostic report/image available.",{resultType:"Imaging",flag:"Abnormal",fileIds:[meta.id]});
   renderFaculty();
  }catch(e){console.error(e);alert("The file could not be saved in this browser.");}
 };

 savePendingItem.onclick=()=>{
   const patientId=selectedId,k=liveKind.value,title=liveTitle.value.trim(),content=liveContent.value.trim();
   if(!title||!content){alert("Enter a title and content.");return}
   queueRelease(k,patientId,title,content,{
     provider:liveProvider.value.trim(),
     orderType:liveOrderType.value,
     flag:liveFlag.value
   });
   renderFaculty();
 };
 facultySaveMessagePending.onclick=()=>{
   const patientId=selectedId;
   const title=facultyMessageSubject.value.trim()||"Faculty Message";
   const content=facultyMessageBody.value.trim();
   if(!content){alert("Enter a message.");return}
   queueRelease("message",patientId,title,content,{provider:"Faculty"});
   renderFaculty();
 };
 facultySendMessageNow.onclick=()=>{
   const patientId=selectedId;
   const title=facultyMessageSubject.value.trim()||"Faculty Message";
   const content=facultyMessageBody.value.trim();
   if(!content){alert("Enter a message.");return}
   const item=queueRelease("message",patientId,title,content,{provider:"Faculty"});
   releaseItem(item.id);
 };
 document.querySelectorAll(".releaseNow").forEach(b=>b.onclick=()=>releaseItem(b.dataset.id));

 savePin.onclick=()=>{state.settings.facultyPin=pinSetting.value.trim()||"2026";liveSave("settings_changed");alert("Faculty PIN saved.")};
 resetPatient.onclick=()=>{
  const id=selectedId;
  if(!confirm("Reset student charting for this patient and return the scenario to its starting state?"))return;
  for(const k of ["orders","assessments","vitals","io","notes","labs","mar","laborProgress","postpartumRecovery","pphPads","pphMedications","bloodAdministration"])if(state[k])state[k]=state[k].filter(x=>x.patientId!==id);
  state.surgicalChecklist=(state.surgicalChecklist||[]).filter(x=>x.patientId!==id);
  state.surgicalAssessments=(state.surgicalAssessments||[]).filter(x=>x.patientId!==id);
  state.releaseQueue=(state.releaseQueue||[]).filter(x=>x.patientId!==id);
  state.messages=(state.messages||[]).filter(x=>x.patientId!==id);
  state.notifications=(state.notifications||[]).filter(x=>x.patientId!==id);
  state.diagnosticFiles=(state.diagnosticFiles||[]).filter(x=>x.patientId!==id);
  state.labPanels=(state.labPanels||[]).filter(x=>x.patientId!==id);
  if(state.scenarioStage)delete state.scenarioStage[id];
  state.audit=state.audit.filter(x=>x.patientId!==id);
  if(id==="amelia-sung")ensureSeededAmelia();
  if(id==="jane-fowler")ensureSeededJane();
  audit("Simulation reset",id,"Patient chart returned to starting state; baseline scenario data restored");
  liveSave("simulation_reset",{patientId:id});renderFaculty();
 };
 downloadBackup.onclick=()=>{
  const blob=new Blob([JSON.stringify({application:"ATU Simulation Hospital EHR",version:"v4",exportedAt:new Date().toISOString(),data:state},null,2)],{type:"application/json"});
  const u=URL.createObjectURL(blob),a=document.createElement("a");a.href=u;a.download=`ATU_EHR_Backup_${new Date().toISOString().slice(0,10)}.json`;a.click();URL.revokeObjectURL(u)
 };
}
function renderDebrief(){
 if(!isFaculty()){currentView="patients";render();return}
 const opts=state.patients.map(p=>`<option value="${esc(p.id)}" ${p.id===activePatientId?"selected":""}>${esc(p.name)} — ${esc(p.mrn)}</option>`).join("");
 document.getElementById("view").innerHTML=panel("Debrief / Audit",`<div class="grid"><label>Patient<select id="dPatient">${opts}</select></label><div style="align-self:end"><button id="buildDebrief" class="primary">Build Debrief</button></div></div><div id="dResult" style="margin-top:10px"></div>`);
 buildDebrief.onclick=()=>{const id=dPatient.value,p=state.patients.find(x=>x.id===id),a=state.audit.filter(x=>x.patientId===id),counts={assess:state.assessments.filter(x=>x.patientId===id).length,orders:state.orders.filter(x=>x.patientId===id).length,notes:state.notes.filter(x=>x.patientId===id).length,vitals:state.vitals.filter(x=>x.patientId===id).length};
 const janeDebrief=id==="jane-fowler"?`<div class="patientCard" style="margin-top:10px"><b>Jane Fowler Debrief Focus</b><br><span class="note">
 • Recognize opioid adverse effects and respiratory depression.<br>
 • Explain interventions for respiratory depression and bag-mask ventilation.<br>
 • Review assessment findings, missed cues, response to Narcan, and stability after treatment.<br>
 • Reflect on what went well and what would be handled differently next time.
 </span></div>`:"";
 dResult.innerHTML=`<div class="success"><b>${esc(p.name)}</b> — MRN ${esc(p.mrn)}</div><div class="grid4" style="margin:10px 0"><div class="kpi"><span class="note">Assessments</span><br><b>${counts.assess}</b></div><div class="kpi"><span class="note">Orders</span><br><b>${counts.orders}</b></div><div class="kpi"><span class="note">Notes</span><br><b>${counts.notes}</b></div><div class="kpi"><span class="note">Vitals</span><br><b>${counts.vitals}</b></div></div><table><thead><tr><th>Time</th><th>Event</th><th>Details</th></tr></thead><tbody>${a.map(x=>`<tr><td>${esc(x.at)}</td><td>${esc(x.type)}</td><td>${esc(x.details)}</td></tr>`).join("")||'<tr><td colspan="3">No activity.</td></tr>'}</tbody></table>`;};
}
document.querySelectorAll("aside button").forEach(b=>b.onclick=()=>{if(!isFaculty()&&b.classList.contains("facultyOnly")){alert("Faculty Mode is required.");return}saveCurrentViewDraft();currentView=b.dataset.view;render()});
document.getElementById("toggleMode").onclick=toggleMode;
try{applyMode()}catch(e){atuReportRuntimeError("Apply mode: "+e.message,"startup",0,0,e)}
try{initializeNativeCharts()}catch(e){atuReportRuntimeError("Native charts: "+e.message,"startup",0,0,e)}
try{initializeAdminEnhancements()}catch(e){atuReportRuntimeError("Admin enhancements: "+e.message,"startup",0,0,e)}
try{initializeMedicationSystem()}catch(e){atuReportRuntimeError("Medication system: "+e.message,"startup",0,0,e)}
try{initializeSimulationWorkflows()}catch(e){atuReportRuntimeError("Simulation workflows: "+e.message,"startup",0,0,e)}
try{render()}catch(e){atuReportRuntimeError("Initial render: "+e.message,"startup",0,0,e)}
atuCloudInit();
</script>
</body>
</html>
